<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to real
       values. Without it the tab bar's safe-area padding was always max(8px, 0)
       and sat under the home indicator. Pinch zoom stays off deliberately: the
       app maps the pinch gesture to its own font scaling instead. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Dr. 張簡 En-中 Reference</title>

  <link rel="apple-touch-icon" href="apple-touch-icon.jpg?v=2">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- black-translucent lets the app paint under the status bar, so it follows
       the active theme instead of being permanently light. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dr. 張簡">
  <meta name="theme-color" content="#faf8f5" id="theme-color-meta">
  <meta name="description" content="Offline English–Chinese dictionary built on CC-CEDICT and ECDICT.">

  <!-- Applied before the stylesheet so a dark-theme launch never flashes white.
       The full theme is written to :root once the app boots. -->
  <script>
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('drt_prefs') || 'null');
        if (p && p.themeId && p.themeId !== 'light') {
          document.documentElement.setAttribute('data-booting-theme', p.themeId);
          var bg = { dark: '#1a1815', cherry: '#fef5f8', blue: '#f0f5fa' }[p.themeId];
          if (bg) {
            document.documentElement.style.background = bg;
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', bg);
          }
        }
        if (p && p.fontSize) document.documentElement.style.setProperty('--fs', p.fontSize + 'px');
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">

</head>
<body>
  <div id="root"></div>

  <script>
    // ─── Themes ────────────────────────────────────────────────────────────
    const THEMES = {
      light: { id: "light", name: "Light", emoji: "☀️", ink: "#1a1a1a", inkLight: "#4a4a4a", inkMuted: "#6b6b6b", paper: "#faf8f5", paperWarm: "#f5f0e8", paperDeep: "#ece5d8", accent: "#c0392b", accentGlow: "rgba(192,57,43,0.08)", gold: "#b8860b", goldSoft: "#f0e6c8", border: "#e0d8cc", cardBg: "#ffffff", tabBg: "rgba(250,248,245,0.92)", wodGrad: "linear-gradient(135deg,#fefcf9 0%,#f8f0e3 100%)", synBg: "#eef5ee", synColor: "#2d6a2e", synBorder: "#c8e0c8", antBg: "#fef0f0", antColor: "#a83232", antBorder: "#f0d0d0" },
      dark: { id: "dark", name: "Dark", emoji: "🌙", ink: "#e8e4df", inkLight: "#b8b4ae", inkMuted: "#9a958d", paper: "#1a1815", paperWarm: "#252220", paperDeep: "#1f1d1a", accent: "#e8654a", accentGlow: "rgba(232,101,74,0.12)", gold: "#d4a843", goldSoft: "#3a3425", border: "#3a3632", cardBg: "#252220", tabBg: "rgba(26,24,21,0.94)", wodGrad: "linear-gradient(135deg,#2a2620 0%,#302a22 100%)", synBg: "#1e2a1e", synColor: "#7cc47c", synBorder: "#2a3d2a", antBg: "#2e1e1e", antColor: "#e88080", antBorder: "#3d2a2a" },
      cherry: { id: "cherry", name: "Cherry Blossom", emoji: "🌸", ink: "#4a2040", inkLight: "#6d4060", inkMuted: "#8a5878", paper: "#fef5f8", paperWarm: "#fce8f0", paperDeep: "#f8d8e4", accent: "#d4467a", accentGlow: "rgba(212,70,122,0.1)", gold: "#c07048", goldSoft: "#f8e0d0", border: "#f0c8d8", cardBg: "#ffffff", tabBg: "rgba(254,245,248,0.92)", wodGrad: "linear-gradient(135deg,#fff5f8 0%,#fce0ec 100%)", synBg: "#f0f5ee", synColor: "#507040", synBorder: "#d0e0c8", antBg: "#fef0f0", antColor: "#b04050", antBorder: "#f0d0d0" },
      blue: { id: "blue", name: "Ocean Blue", emoji: "🌊", ink: "#1a2a3a", inkLight: "#3a5068", inkMuted: "#5a7285", paper: "#f0f5fa", paperWarm: "#e0eaf4", paperDeep: "#d0dde8", accent: "#2070b8", accentGlow: "rgba(32,112,184,0.1)", gold: "#b08830", goldSoft: "#e8dcc0", border: "#c0d0e0", cardBg: "#ffffff", tabBg: "rgba(240,245,250,0.92)", wodGrad: "linear-gradient(135deg,#f4f8fc 0%,#dce8f4 100%)", synBg: "#e8f4ee", synColor: "#2a6848", synBorder: "#b8dcc8", antBg: "#fce8e8", antColor: "#a83232", antBorder: "#f0d0d0" }
    };

    // ─── Dictionary State ──────────────────────────────────────────────────
    let DICTIONARY = [];
    let BY_ID = new Map();     // id -> entry, so lookups aren't a 183k linear scan
    let BY_EN = new Map();     // lowercased English headword -> most common entry
    let BY_ZH = new Map();     // traditional headword -> most common entry
    let BY_ZH_S = new Map();   // simplified-only headword -> most common entry.
                               // Kept separate so that 咊 (simplified 和) cannot
                               // outrank the actual entry for 和.

    // Definition text for searching lives in one big lowercase string rather than
    // a normalized copy on every entry. 183k small strings cost far more in object
    // overhead than one blob plus an offset table, and scanning it with indexOf is
    // fast enough to search every entry instead of bailing out early.
    let DEF_BLOB = "";
    let DEF_OFF = null;        // Uint32Array: entry index -> start offset in DEF_BLOB

    const FONT_SIZES = [{label:"S",value:14},{label:"M",value:16},{label:"L",value:18},{label:"XL",value:21},{label:"XXL",value:25},{label:"XXXL",value:30}];
    const MIN_FONT = 14, MAX_FONT = 30;

    const EXCHANGE_LABELS = { p: "Past tense", d: "Past participle", i: "Present participle",
      '3': "3rd person singular", r: "Comparative", t: "Superlative", s: "Plural",
      '0': "Base form", '1': "Related forms" };

    const EXAM_TAGS = { zk: "中考", gk: "高考", cet4: "CET-4", cet6: "CET-6",
      ky: "考研", toefl: "TOEFL", gre: "GRE", ielts: "IELTS" };

    // ─── Icons ─────────────────────────────────────────────────────────────
    const I = {
      Search: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>`,
      Speaker: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>`,
      Star: function(f) { return `<svg width="18" height="18" viewBox="0 0 24 24" fill="${f ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`; },
      Copy: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>`,
      Back: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>`,
      Home: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
      Heart: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>`,
      Gear: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>`,
      Book: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>`,
      X: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>`,
      Sparkle: `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0L14.59 8.41L23 12L14.59 15.59L12 24L9.41 15.59L1 12L9.41 8.41Z"/></svg>`,
      Trash: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>`,
      Check: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
      Clock: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,
      SpeakerMini: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>`,
      Share: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>`,
      ExtLink: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`,
    };

    // ─── Utility ───────────────────────────────────────────────────────────
    function escapeHTML(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // Word of the Day is drawn from a frequency-ranked shortlist. Picking
    // uniformly across all 183k entries meant it nearly always landed on
    // something like 羅漢病 ("snail fever") rather than a word worth learning.
    let WOD_POOL = null;
    const WOD_POOL_SIZE = 3000;

    function wordOfDayPool() {
      if (WOD_POOL) return WOD_POOL;
      WOD_POOL = DICTIONARY
        .filter(function(w) {
          if (!w.freq || w.freq > 12000) return false;
          if (w._type !== "zh-en") return false;          // the headword should be Chinese
          if (w.chinese_traditional.length < 2) return false;  // single characters are dull
          if (w.chinese_traditional.length > 4) return false;
          if (/^(surname |variant |old variant |used in |see |abbr)/i.test(w.english_word)) return false;
          if (/[A-Za-z0-9]/.test(w.chinese_traditional)) return false;
          return true;
        })
        .sort(function(a, b) { return a.freq - b.freq; })
        .slice(0, WOD_POOL_SIZE);
      return WOD_POOL;
    }

    function getWordOfDay() {
      const pool = wordOfDayPool();
      if (!pool.length) return DICTIONARY.length ? DICTIONARY[0] : null;
      const t = new Date();
      const seed = t.getFullYear() * 10000 + (t.getMonth() + 1) * 100 + t.getDate();
      return pool[seed % pool.length];
    }

    function norm(s) {
      if (!s) return "";
      return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
    }

    var TONE_MAP = {
      a: ['\u0101','\u00e1','\u01ce','\u00e0','a'],
      e: ['\u0113','\u00e9','\u011b','\u00e8','e'],
      i: ['\u012b','\u00ed','\u01d0','\u00ec','i'],
      o: ['\u014d','\u00f3','\u01d2','\u00f2','o'],
      u: ['\u016b','\u00fa','\u01d4','\u00f9','u'],
      v: ['\u01d6','\u01d8','\u01da','\u01dc','\u00fc']
    };
    function pinyinTone(str) {
      if (!str) return "";
      return str.replace(/([a-zA-Zü]+)(\d)/g, function(match, syl, tone) {
        var t = parseInt(tone);
        if (t < 1 || t > 5) return match;
        var s = syl.toLowerCase().replace(/v/g, 'ü');
        var vowels = 'aeiouü';
        var idx = -1;
        if (s.indexOf('a') !== -1) idx = s.indexOf('a');
        else if (s.indexOf('e') !== -1) idx = s.indexOf('e');
        else if (s.indexOf('ou') !== -1) idx = s.indexOf('o');
        else {
          for (var i = s.length - 1; i >= 0; i--) {
            if (vowels.indexOf(s[i]) !== -1) { idx = i; break; }
          }
        }
        if (idx === -1) return s;
        var ch = s[idx] === 'ü' ? 'v' : s[idx];
        var toned = TONE_MAP[ch] ? TONE_MAP[ch][t - 1] : s[idx];
        return s.substring(0, idx) + toned + s.substring(idx + 1);
      });
    }

    // Escapes a value for use inside a single-quoted JS string in an inline
    // handler. Newlines matter: a raw one is a syntax error in a string literal,
    // and CC-CEDICT glosses do contain them.
    function safeQuote(text) {
      if (text === null || text === undefined) return "";
      return String(text)
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/\r/g, '\\r')
        .replace(/\n/g, '\\n')
        .replace(/</g, '&lt;')
        .replace(/"/g, '&quot;');
    }

    function spkBtn(text, lang) {
      if (!text) return "";
      var safe = safeQuote(text);
      if (lang === "auto") lang = /[一-鿿㐀-䶿]/.test(text) ? "zh" : "en";
      return ' <button class="spk" aria-label="Pronounce" onclick="event.stopPropagation();app.speak(\'' + safe + '\',\'' + lang + '\',this)" title="Listen">' + I.SpeakerMini + '</button>';
    }

    var SKIP_WORDS = new Set(["a","an","the","of","to","in","on","at","is","it","or","and","for","by","as","be","do","if","no","so","up","we","he","me","my","us","not","but","are","was","has","had","its","all","can","may","one","two","any","few","who","how","also","from","that","this","with","have","will","been","were","into","than","them","they","each","more","some","very","much","most","only","over","just","such","same","does","did","get","got","yet","our","own","way"]);

    // Splits text into tappable lookup targets. The trailing `[^...]` alternative
    // must accept a lone '[': without it an unclosed bracket matched no branch at
    // all and String.match(/g) dropped the character from the output entirely.
    var LINKIFY_RE = /[一-鿿㐀-䶿豈-﫿]+|[a-zA-Z'À-ſ]+|\[[^\]]*\]|[\s\S]/g;

    function linkify(text, splitChineseChars) {
      if (!text) return "";
      var parts = String(text).match(LINKIFY_RE);
      if (!parts) return escapeHTML(text);
      var html = "", plain = "";
      function flush() { if (plain) { html += escapeHTML(plain); plain = ""; } }

      for (var i = 0; i < parts.length; i++) {
        var p = parts[i];
        if (/^[一-鿿㐀-䶿豈-﫿]+$/.test(p)) {
          flush();
          if (splitChineseChars) {
            for (var c = 0; c < p.length; c++) {
              var ch = p[c];
              html += '<span class="wlink wlink-zh" lang="zh-Hant" role="button" tabindex="0" onclick="event.stopPropagation();app.lookupWord(\'' + safeQuote(ch) + '\')">' + escapeHTML(ch) + '</span>';
            }
          } else {
            html += '<span class="wlink wlink-zh" lang="zh-Hant" role="button" tabindex="0" onclick="event.stopPropagation();app.lookupWord(\'' + safeQuote(p) + '\')">' + escapeHTML(p) + '</span>';
          }
        } else if (/^[a-zA-Z'À-ſ]+$/.test(p)) {
          if (p.length <= 2 || SKIP_WORDS.has(p.toLowerCase())) { plain += p; }
          else {
            flush();
            html += '<span class="wlink wlink-en" role="button" tabindex="0" onclick="event.stopPropagation();app.lookupWord(\'' + safeQuote(p) + '\')">' + escapeHTML(p) + '</span>';
          }
        } else if (p.charAt(0) === '[' && p.length > 1) {
          flush();
          html += '<span class="wlink-py">' + escapeHTML(pinyinTone(p.slice(1, -1))) + '</span>';
        } else {
          plain += p;
        }
      }
      flush();
      return html;
    }

    // Keep whichever homograph has the better (lower) frequency rank.
    function indexHeadword(map, key, entry) {
      if (!key) return;
      var cur = map.get(key);
      if (!cur || (entry.freq || 2000000) < (cur.freq || 2000000)) map.set(key, entry);
    }

    // Which entry does a DEF_BLOB offset belong to? Binary search the offset table.
    function entryAtOffset(off) {
      var lo = 0, hi = DEF_OFF.length - 1, ans = 0;
      while (lo <= hi) {
        var mid = (lo + hi) >> 1;
        if (DEF_OFF[mid] <= off) { ans = mid; lo = mid + 1; } else { hi = mid - 1; }
      }
      return ans;
    }

    var SCORE_EXACT = 100, SCORE_PREFIX = 90, SCORE_DEF_WORD = 80,
        SCORE_ZH_PART = 70, SCORE_DEF_PART = 60;
    var DEF_BUCKET_CAP = 400;   // per tier; headword tiers are never capped
    var SCAN_GUARD = 200000;    // ceiling on indexOf steps for very common substrings

    function searchDB(q) {
      if (!q || !q.trim() || !DICTIONARY.length) return [];
      var raw = q.trim();
      var n = norm(raw);
      if (!n) return [];
      var isCJK = /[一-鿿㐀-䶿豈-﫿]/.test(raw);

      var best = new Map();
      function bump(idx, s) {
        var cur = best.get(idx);
        if (cur === undefined || s > cur) best.set(idx, s);
      }

      // Pass 1 — headwords. Scans every entry: this tier decides whether an exact
      // match is found at all, so it must never bail out early. (The old code
      // broke out after 500 raw matches and then sorted, which meant a perfect
      // match late in the file was simply never seen.)
      for (var i = 0; i < DICTIONARY.length; i++) {
        var w = DICTIONARY[i], s = 0;
        if (w._enLow === n || w._pyNorm === n || w._pyJoined === n ||
            w.chinese_traditional === raw || w.chinese_simplified === raw) {
          s = SCORE_EXACT;
        } else if (w._enLow.indexOf(n) === 0 || (w._pyJoined && w._pyJoined.indexOf(n) === 0)) {
          s = SCORE_PREFIX;
        } else if (isCJK && (w.chinese_traditional.indexOf(raw) !== -1 ||
                             (w.chinese_simplified && w.chinese_simplified.indexOf(raw) !== -1))) {
          s = SCORE_ZH_PART;
        }
        if (s) bump(i, s);
      }

      // Pass 2 — definitions, over the single lowercase blob. Whole-word and
      // substring hits are capped separately so a flood of substring noise can't
      // crowd out whole-word matches the way one shared cap would.
      if (DEF_OFF && n.length > 1) {
        var pos = 0, steps = 0, nWord = 0, nPart = 0, len = n.length;
        while (steps++ < SCAN_GUARD && (nWord < DEF_BUCKET_CAP || nPart < DEF_BUCKET_CAP)) {
          var at = DEF_BLOB.indexOf(n, pos);
          if (at < 0) break;
          pos = at + len;
          var before = at === 0 ? ' ' : DEF_BLOB.charAt(at - 1);
          var after = DEF_BLOB.charAt(at + len) || ' ';
          var whole = !/[a-z0-9]/.test(before) && !/[a-z0-9]/.test(after);
          if (whole ? nWord < DEF_BUCKET_CAP : nPart < DEF_BUCKET_CAP) {
            var idx = entryAtOffset(at);
            if (!best.has(idx)) { if (whole) nWord++; else nPart++; }
            bump(idx, whole ? SCORE_DEF_WORD : SCORE_DEF_PART);
          }
        }
      }

      // Rank by match quality, then by corpus frequency so common words surface
      // first instead of whatever happened to come first in the file.
      var ranked = [];
      best.forEach(function(score, idx) { ranked.push([score, idx]); });
      ranked.sort(function(a, b) {
        if (b[0] !== a[0]) return b[0] - a[0];
        var fa = DICTIONARY[a[1]].freq || 2000000, fb = DICTIONARY[b[1]].freq || 2000000;
        if (fa !== fb) return fa - fb;
        return a[1] - b[1];
      });

      var out = [];
      for (var k = 0; k < ranked.length && k < 60; k++) {
        var e = DICTIONARY[ranked[k][1]];
        var sub;
        if (e._type === "en-zh") {
          sub = e.zh_trans.length ? e.zh_trans[0] : e.english_word;
          if (e.phonetic_en) sub = e.phonetic_en + ' · ' + sub;
        } else {
          sub = e.chinese_traditional + ' · ' + pinyinTone(e.pinyin);
        }

    // ─── App State & Logic ─────────────────────────────────────────────────
    const app = {

      async init() {

            <div id="loading-text" style="font-weight:600;">Loading Dictionary... 0%</div>
          </div>
          <style>@keyframes pulse { 0% { opacity: 0.5; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1.05); } 100% { opacity: 0.5; transform: scale(0.95); } }</style>
        `;

        try {
          const response = await fetch('dictionary.jsonl');
          if (!response.ok) throw new Error("Could not fetch dictionary.jsonl (" + response.status + ")");
          let text = await response.text();
          const lines = text.split('\n');
          text = null;   // 28MB; the split copy is all we need from here on

          const defChunks = [];
          const offsets = [];
          let blobLen = 0;

          await new Promise((resolve) => {
            let i = 0;
            const chunkSize = 4000;

            const processChunk = () => {
              const end = Math.min(i + chunkSize, lines.length);

              for (; i < end; i++) {
                const line = lines[i];
                lines[i] = null;   // release as we go; the raw text is 28MB
                if (!line) continue;

                let e;
                try { e = JSON.parse(line); } catch (err) { continue; }
                if (!e || e.i === undefined) continue;

                let w;
                if (e.t === 0) {
                  // 中→英 (CC-CEDICT). The headword is Chinese; d[0] is the gloss.
                  const defs = e.d || [];
                  w = {
                    id: e.i,
                    _type: "zh-en",
                    english_word: defs[0] || e.w,
                    chinese_traditional: e.w,
                    chinese_simplified: e.s || e.w,
                    pinyin: e.p || "",
                    phonetic_en: "",
                    definitions: defs,

                  w._pyJoined = pyPlain.replace(/\s/g, "");
                } else {

                  const zh = e.z || [];
                  const defs = e.d || [];
                  let displayZh = "";
                  if (zh.length) {
                    displayZh = zh.map(function(t) { return t.replace(/^[a-z]+\.\s*/i, ""); }).join("; ");
                    if (displayZh.length > 40) displayZh = displayZh.substring(0, 40) + "…";
                  }

                  w = {
                    id: e.i,
                    _type: "en-zh",
                    english_word: e.w,
                    chinese_traditional: displayZh,
                    chinese_simplified: "",
                    pinyin: "",
                    phonetic_en: e.h || "",
                    definitions: defs,
                    zh_trans: zh,
                    exchange: e.x || "",
                    freq: e.f || 0,
                    tags: e.g || "",
                    collins: e.c || 0

                  w._pyJoined = "";

                // copy per entry (see DEF_BLOB above).

                defChunks.push(searchText);
                blobLen += searchText.length + 1;   // +1 for the '\n' joiner

                // opens "and" rather than the surname that happens to be listed first.

      // ─── Character decomposition ─────────────────────────────────────────

      decompose: function(w) {
        if (!w || w._type !== "zh-en") return [];
        // Follow the headword's script so the breakdown doesn't show 電腦 while
        // the word above it reads 电脑.
        var useSimp = this.state.scriptPref === 'simp' &&
                      w.chinese_simplified && w.chinese_simplified !== w.chinese_traditional;
        var source = useSimp ? w.chinese_simplified : w.chinese_traditional;
        var chars = String(source || "").split('');
        var syllables = String(w.pinyin || "").trim().split(/\s+/);
        var out = [];
        for (var i = 0; i < chars.length; i++) {
          var ch = chars[i];
          if (!/[一-鿿㐀-䶿豈-﫿]/.test(ch)) continue;
          var entry = useSimp ? (BY_ZH_S.get(ch) || BY_ZH.get(ch)) : (BY_ZH.get(ch) || BY_ZH_S.get(ch));
          out.push({
            char: ch,
            pinyin: pinyinTone(syllables[i] || (entry ? entry.pinyin : "") || ""),

      // ─── Pinch to resize text ────────────────────────────────────────────
      // Native pinch zoom is disabled on purpose (see the viewport meta), so the
      // gesture is bound to the app's own font scale instead of being dead.
      // WebKit's gesture events cover iOS; the touch fallback covers everything
      // else that reports two touch points.
      initPinch: function() {
        var self = this;
        var base = 0, active = false;

        function begin() { base = self.state.fontSize; active = true; }
        function apply(scale) {
          if (!active) return;
          var next = Math.round(base * scale);
          next = Math.max(MIN_FONT, Math.min(MAX_FONT, next));
          if (next !== self.state.fontSize) {
            self.state.fontSize = next;

            self.showZoomHint(next);

          if (active && e.touches.length < 2) { startDist = 0; end(); }
        }, { passive: true });

      // The six most recently opened words, resolved from history and de-duped.

          var h = this.state.history[i];

          seen[h.wordId] = 1;
          var w = BY_ID.get(Number(h.wordId));
          if (!w && String(h.wordId).indexOf('api_') === 0) w = this.makeApiWord(String(h.wordId).substring(4));

      // Label for wherever "back" will take us — used by both the header

      getBackLabel: function(max) {

          var p = s.navStack[s.navStack.length - 1];

        } else {
          label = 'Home';

      // ─── Swipe from the left edge to go back ─────────────────────────────
      // Standalone iOS gives us no native edge-swipe (there are no history
      // entries to pop), so we drive the gesture ourselves.
      initSwipe: function() {
        var self = this;
        var EDGE = 32;      // px from the left edge where a swipe may start
        var COMMIT = 0.32;  // fraction of the page width needed to commit
        var FLICK = 0.5;    // px/ms of recent travel that counts as a flick
        var FLICK_MIN = 48; // ...but a flick still has to cover this much ground,
                            // so a stray few-px slide near the edge can't navigate
        var sw = { on: false, track: false, x0: 0, y0: 0, t0: 0, dx: 0, w: 0, lastDx: 0, lastT: 0, vel: 0 };

        function page() { return document.getElementById('page-content'); }
        function reveal() { return document.getElementById('swipe-backdrop'); }

        function settle(commit) {
          var p = page(), b = reveal();
          if (!p) return;
          p.classList.remove('swiping');
          p.classList.add('settling');
          p.style.transform = commit ? 'translateX(100%)' : '';
          setTimeout(function() {
            if (commit) {
              self.goBack();          // render() replaces #page-content wholesale
            } else if (p.parentNode) {
              p.classList.remove('settling');
              p.style.transform = '';
            }
            if (b) b.classList.remove('on');
          }, 260);
        }

        document.addEventListener('touchstart', function(e) {
          if (sw.on || e.touches.length !== 1) return;
          if (!self.canGoBack()) return;
          var t = e.touches[0];
          if (t.clientX > EDGE) return;
          var p = page();
          sw.on = true; sw.track = false; sw.dx = 0;
          sw.x0 = t.clientX; sw.y0 = t.clientY; sw.t0 = Date.now();
          sw.lastDx = 0; sw.lastT = sw.t0; sw.vel = 0;
          sw.w = (p && p.offsetWidth) || window.innerWidth;
        }, { passive: true });

        document.addEventListener('touchmove', function(e) {
          if (!sw.on) return;
          var t = e.touches[0];
          var dx = t.clientX - sw.x0, dy = t.clientY - sw.y0;
          if (!sw.track) {
            // Let vertical scrolling win if that's clearly the intent.
            if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 6) { sw.on = false; return; }
            if (dx < 10) return;
            sw.track = true;
            var p = page(), b = reveal();
            if (p) { p.classList.remove('settling'); p.classList.add('swiping'); }
            if (b) b.classList.add('on');
          }
          e.preventDefault(); // also suppresses Safari's own edge-swipe in browser mode
          sw.dx = Math.max(0, Math.min(dx, sw.w));
          // Sample velocity over the most recent movement only — averaging across
          // the whole gesture would let a long slow drag inherit a fast start.
          var nt = Date.now(), dt = nt - sw.lastT;
          if (dt > 0) { sw.vel = (sw.dx - sw.lastDx) / dt; sw.lastDx = sw.dx; sw.lastT = nt; }
          var pg = page();
          if (pg) pg.style.transform = 'translateX(' + sw.dx + 'px)';
        }, { passive: false });

        function endSwipe(cancelled) {
          if (!sw.on) return;
          var tracked = sw.track;
          sw.on = false; sw.track = false;
          if (!tracked) return;
          // touchcancel means the system took over (call, Control Center, notch
          // pull). Always snap back — never navigate on an interrupted gesture.
          if (cancelled) { settle(false); return; }
          settle(sw.dx > sw.w * COMMIT || (sw.dx > FLICK_MIN && sw.vel > FLICK));
        }
        // Wrapped, not passed directly: the TouchEvent would otherwise arrive as
        // `cancelled` and every touchend would read as an interrupted gesture.
        document.addEventListener('touchend', function() { endSwipe(false); }, { passive: true });
        document.addEventListener('touchcancel', function() { endSwipe(true); }, { passive: true });
      },

      addHistory: function(type, label, sub, wordId) {
        this.state.history = this.state.history.filter(function(h) { return !(h.type === type && h.label === label); });
        this.state.history.unshift({ type: type, label: label, sub: sub, wordId: wordId, timestamp: Date.now() });
        if (this.state.history.length > 100) this.state.history.length = 100;

      openWord: function(w) {
        if (this.state.view !== "detail" || !this.state.sel || this.state.sel.id !== w.id) this.pushHistory();
        if (this.state.view === "detail" && this.state.sel && this.state.sel.id !== w.id) {
          this.state.navStack.push(this.state.sel);
          if (this.state.navStack.length > 50) this.state.navStack.shift();
        }
        this.state.sel = w;
        this.state.view = "detail";
        this.state.focused = false;
        this.state.detailTab = "cn";

        this.state.enDict = null;
        this.state.enDictLoading = false;
        this.state.enDictWord = "";
        this.state.enDictTranslations = {};
        this.state.zhApiTrans = null;
        this.state.zhApiTransLoading = false;
        this.state.zhApiTransIsEn = false;
        this.state.zhApiTransError = false;

        var sub = (w._type === "en-zh" || w._type === "api-only")
          ? (w.phonetic_en ? w.phonetic_en : ((w.zh_trans && w.zh_trans.length > 0) ? w.zh_trans[0] : ""))
          : (w.chinese_traditional + ' · ' + pinyinTone(w.pinyin));
          
        this.addHistory("word", w.english_word, sub, w.id);
        this._reqSeq++;          // invalidate any in-flight request for the previous word

      // A word we have no local entry for, shown via the online translation path.
      makeApiWord: function(word) {
        return {
          id: 'api_' + word, _type: "api-only", english_word: word,
          chinese_traditional: "", chinese_simplified: "", pinyin: "", phonetic_en: "",
          definitions: [], zh_trans: [], exchange: "", freq: 0, tags: "", collins: 0,
          related_words: searchDB(word).slice(0, 5)
        };
      },

      openWordById: function(id) {
        var w = BY_ID.get(Number(id));
        if (!w && String(id).indexOf('api_') === 0) w = this.makeApiWord(String(id).substring(4));

      },

      openSearchResult: function(idx) {
        var r = this.state.results[idx];

      },

      openFromHistory: function(idx) {

      },
      
      forceTranslate: function(term) {

        this.flash('Translating "' + clean + '"…');
      },

      isFav: function(id) {
        var key = String(id);
        return this.state.favs.some(function(f) { return String(f.id) === key; });
      },

      // Favorites store {id, date_added} rather than a copy of the entry. Deep
      // copies carried the search-index fields and, for online-translation
      // entries, five whole dictionary objects under related_words — enough to
      // blow the ~5MB quota, which saveFavs then swallowed silently.
      resolveFav: function(f) {
        var w = BY_ID.get(Number(f.id));
        if (w) return w;
        if (f.w) return this.makeApiWord(f.w);
        return null;
      },

      toggleFav: function(id) {
        var key = String(id);

          this.state.favs = this.state.favs.filter(function(x) { return String(x.id) !== key; });
          this.flash("Removed from favorites");
        } else {
          var w = BY_ID.get(Number(id)) ||
                  (this.state.sel && String(this.state.sel.id) === key ? this.state.sel : null);
          if (!w) { this.flash("Could not save that word"); return; }
          var rec = { id: key, date_added: new Date().toISOString() };
          if (w._type === "api-only") rec.w = w.english_word;
          this.state.favs.push(rec);

          this.render();

          var starBtn = document.getElementById('star-btn-' + id);

            starBtn.setAttribute('aria-pressed', nowFav ? 'true' : 'false');

      speak: function(text, lang, btnElement) {
        if (!text) return;
        if (!window.speechSynthesis) { this.flash("Speech is not available on this device"); return; }
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.rate = 0.9;
        if (btnElement) btnElement.classList.add('sp');
        u.onend = function() { if (btnElement) btnElement.classList.remove('sp'); };
        u.onerror = function() { if (btnElement) btnElement.classList.remove('sp'); };

        if (lang === "zh") {
          var voices = window.speechSynthesis.getVoices();
          var zhVoice = null;
          var prefs = ["zh-CN", "zh-TW", "zh-HK", "zh"];
          for (var p = 0; p < prefs.length && !zhVoice; p++) {
            for (var v = 0; v < voices.length; v++) {
              if (voices[v].lang && voices[v].lang.replace(/_/g, '-').toLowerCase().indexOf(prefs[p].toLowerCase()) === 0) {
                zhVoice = voices[v]; break;
              }
            }
          }
          if (zhVoice) {
            u.voice = zhVoice;
            u.lang = zhVoice.lang;
          } else {
            // No Chinese voice installed: the utterance is silent, so say so
            // rather than letting the button appear broken.
            u.lang = "zh-TW";

          }

          u.lang = "en-US";
        }

      copyWord: function(id) {
        var w = BY_ID.get(Number(id)) || this.state.sel;

        var text;

          text = w.english_word + (w.phonetic_en ? ' ' + w.phonetic_en : '') +
                 (w.zh_trans && w.zh_trans.length ? ' \u2014 ' + w.zh_trans.join('; ') : '');
        } else {
          text = w.english_word + ' (' + w.chinese_traditional + ') \u2014 ' + pinyinTone(w.pinyin);
        }
        var self = this;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(
            function() { self.flash("Copied to clipboard"); },
            function() { self.flash("Could not copy"); }
          );
        } else {
          // navigator.clipboard is undefined outside a secure context; without
          // this branch the button silently did nothing over plain http.

            var ta = document.createElement('textarea');
            ta.value = text;
            ta.setAttribute('readonly', '');
            ta.style.cssText = 'position:absolute;left:-9999px;top:0';
            document.body.appendChild(ta);
            ta.select();
            var ok = document.execCommand && document.execCommand('copy');

          }

      // Every network-backed panel on the detail view is keyed to this counter.
      // openWord() bumps it, and each callback drops its result if the counter
      // has moved on — otherwise tapping A then B quickly renders A's data
      // underneath B's headword.
      _reqSeq: 0,

      GTX: 'https://translate.googleapis.com/translate_a/single?client=gtx&dt=t',

      translateText: function(text, target) {
        var url = this.GTX + '&sl=auto&tl=' + target + '&q=' + encodeURIComponent(text);
        return fetch(url)
          .then(function(r) { return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)); })
          .then(function(data) {
            if (!data || !data[0]) throw new Error('unexpected response shape');
            return data[0].map(function(seg) { return seg[0]; }).join('');
          });
      },

      fetchZhTrans: function(word) {
        if (!word) return;
        var clean = word.trim();
        var seq = this._reqSeq;
        var self = this;

        this.state.zhApiTransLoading = true;
        this.state.zhApiTrans = null;
        this.state.zhApiTransError = false;
        this.paintZhTrans();

        var isZh = /[一-鿿]/.test(clean);
        this.translateText(clean, isZh ? 'en' : 'zh-TW')
          .then(function(trans) {
            if (seq !== self._reqSeq) return;
            if (trans && trans.toLowerCase() !== clean.toLowerCase()) {
              self.state.zhApiTrans = trans;
              self.state.zhApiTransIsEn = isZh;
            }
            self.state.zhApiTransLoading = false;
            self.paintZhTrans();
          })
          .catch(function(err) {
            if (seq !== self._reqSeq) return;
            console.error('Translation failed', err);
            self.state.zhApiTransLoading = false;
            self.state.zhApiTransError = true;   // surfaced, not swallowed
            self.paintZhTrans();
          });

      paintZhTrans: function() {

      paintEnDict: function() {
        var c = document.getElementById('endict-container');
        if (c) c.innerHTML = this.buildEnDictHTML();
      },

      buildZhTransHTML: function() {
        var s = this.state;
        if (s.zhApiTransLoading) {
          return '<div class="ds af d1"><div class="dst">\u{1F310} Web Translation</div><div style="padding:16px;text-align:center;color:var(--ink-m);font-size:calc(var(--fs) - 3px)">Fetching translation…</div></div>';
        }
        if (s.zhApiTransError) {
          return '<div class="ds af d1"><div class="dst">\u{1F310} Web Translation</div><div style="padding:16px;text-align:center;color:var(--ink-m);font-size:calc(var(--fs) - 3px)">Translation unavailable offline.</div></div>';
        }
        if (s.zhApiTrans) {
          var lang = s.zhApiTransIsEn ? 'en' : 'zh';
          var textHTML = s.zhApiTransIsEn ? escapeHTML(s.zhApiTrans) : linkify(s.zhApiTrans);
          var langAttr = s.zhApiTransIsEn ? '' : ' lang="zh-Hant"';
          return '<div class="ds af d1"><div class="dst">\u{1F310} Web Translation</div><div class="ic"><div class="ic-line"><span class="ic-line-text ic-zh"' + langAttr + ' style="font-family: var(--font-' + (s.zhApiTransIsEn ? 'sans' : 'zh') + ')">' + textHTML + '</span>' + spkBtn(s.zhApiTrans, lang) + '</div></div></div>';
        }
        return '';
      },

      // Each definition is translated in its own request. Batching them into one
      // request joined by blank lines and splitting the reply back apart looked
      // cheaper, but the service does not preserve those boundaries, so the
      // Chinese regularly landed under the wrong English definition.
      translateEnDefs: function(dictData, seq) {
        if (!dictData || !dictData.meanings) return;
        var defs = [];
        dictData.meanings.forEach(function(m) {
          (m.definitions || []).forEach(function(d) {
            if (d.definition && defs.length < 6 && defs.indexOf(d.definition) === -1) defs.push(d.definition);
          });
        });
        if (!defs.length) return;

        var self = this;
        Promise.all(defs.map(function(text) {
          return self.translateText(text, 'zh-TW')
            .then(function(zh) { return { key: text, zh: zh }; })
            .catch(function() { return null; });
        })).then(function(pairs) {
          if (seq !== self._reqSeq) return;
          var got = false;
          pairs.forEach(function(pr) {
            if (pr && pr.zh) { self.state.enDictTranslations[pr.key] = pr.zh.trim(); got = true; }
          });
          if (got) self.paintEnDict();
        });
      },

      // The dictionary API takes a single English word. A CC-CEDICT headword's
      // gloss is frequently a whole phrase, and the previous code stripped every
      // non-letter — including spaces — turning "percent (Tw)" into "percenttw"
      // and firing a junk request for 83% of entries.
      enDictQueryFor: function(w) {
        if (!w) return "";
        if (w._type === "en-zh" || w._type === "api-only") {
          var head = String(w.english_word || "").toLowerCase().trim();
          return /^[a-z][a-z'-]*$/.test(head) ? head : "";
        }
        var gloss = String(w.english_word || "").toLowerCase().trim();
        gloss = gloss.replace(/\s*\(.*?\)\s*/g, ' ').trim();   // drop "(Tw)" style notes
        return /^[a-z][a-z'-]*$/.test(gloss) ? gloss : "";
      },

      fetchEnDict: function(word) {
        var clean = typeof word === 'string' ? word : this.enDictQueryFor(word);
        var seq = this._reqSeq;
        var self = this;

        if (!clean || clean.length < 2) {
          this.state.enDict = null;
          this.state.enDictLoading = false;
          this.paintEnDict();
          return;
        }

        if (Object.prototype.hasOwnProperty.call(this.enDictCache, clean)) {
          this.state.enDict = this.enDictCache[clean];
          this.state.enDictWord = clean;
          this.state.enDictLoading = false;
          this.paintEnDict();
          if (this.state.enDict) this.translateEnDefs(this.state.enDict, seq);
          return;
        }

        this.state.enDictLoading = true;
        this.state.enDictWord = clean;
        this.state.enDict = null;
        this.paintEnDict();

        fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(clean))
          .then(function(r) { return r.ok ? r.json() : Promise.reject(new Error('not found')); })
          .then(function(data) {
            var entry = (data && data.length) ? data[0] : null;
            self.enDictCache[clean] = entry;
            if (seq !== self._reqSeq) return;
            self.state.enDict = entry;
            self.state.enDictLoading = false;
            self.paintEnDict();
            if (entry) self.translateEnDefs(entry, seq);
          })
          .catch(function() {
            self.enDictCache[clean] = null;
            if (seq !== self._reqSeq) return;
            self.state.enDict = null;
            self.state.enDictLoading = false;
            self.paintEnDict();
          });
      },

      buildEnDictHTML: function() {
        var s = this.state;
        if (s.enDictLoading) {
          return '<div class="ds af"><div class="dst">📖 English Dictionary</div><div style="padding:16px;text-align:center;color:var(--ink-m);font-size:13px">Loading definition…</div></div>';
        }
        if (!s.enDict) return '';
        var d = s.enDict;
        var html = '<div class="ds af"><div class="dst">📖 English Dictionary</div>';
        var phText = '';
        if (d.phonetics && d.phonetics.length > 0) {
          for (var i = 0; i < d.phonetics.length; i++) {
            if (d.phonetics[i].text) { phText = d.phonetics[i].text; break; }
          }
        }
        if (d.phonetic) phText = d.phonetic;
        if (phText) {
          html += '<div style="margin-bottom:16px"><span class="ph" style="font-size:calc(15px * var(--sc))">' + escapeHTML(phText) + '</span>';
          var audioUrl = '';
          if (d.phonetics) {
            for (var i = 0; i < d.phonetics.length; i++) {
              if (d.phonetics[i].audio) { audioUrl = d.phonetics[i].audio; break; }
            }
          }
          if (audioUrl) {
            html += ' <button class="spk" onclick="event.stopPropagation();var a=new Audio(\'' + escapeHTML(audioUrl) + '\');a.play()" title="Listen">' + I.SpeakerMini + '</button>';
          }
          html += '</div>';
        }
        if (d.meanings && d.meanings.length > 0) {
          d.meanings.forEach(function(m) {
            html += '<div class="pos-group">';
            if (m.partOfSpeech) {
              html += '<div class="pos-label">' + escapeHTML(m.partOfSpeech) + '</div>';
            }
            html += '<div class="pos-defs">';
            var defs = m.definitions || [];
            var maxDefs = Math.min(defs.length, 5);
            for (var i = 0; i < maxDefs; i++) {
              var def = defs[i];
              html += '<div class="endict-def">';
              html += '<span class="pos-def-num">' + (i + 1) + '</span>';
              html += '<div class="endict-def-body">';
              html += '<div class="endict-def-text">' + linkify(def.definition || '') + '</div>';
              
              // INJECT CHINESE TRANSLATION HERE if available
              if (s.enDictTranslations && s.enDictTranslations[def.definition]) {
                html += '<div style="font-family:var(--font-zh); font-size:calc(var(--fs) - 1px); color:var(--accent); margin-top:4px; line-height:1.5;">' + linkify(s.enDictTranslations[def.definition]) + '</div>';
              }

              if (def.example) {
                html += '<div class="endict-example">"' + escapeHTML(def.example) + '"</div>';
              }
              if (def.synonyms && def.synonyms.length > 0) {
                html += '<div class="endict-syn">' + def.synonyms.slice(0, 5).map(function(sy) {
                  return '<span class="tag ts" onclick="app.lookupWord(\'' + safeQuote(sy) + '\')">' + escapeHTML(sy) + '</span>';
                }).join('') + '</div>';
              }
              html += '</div></div>';
            }
            if (defs.length > 5) {
              html += '<div style="padding:4px 0 8px 28px;font-size:12px;color:var(--ink-m)">+ ' + (defs.length - 5) + ' more definitions</div>';
            }
            html += '</div></div>';
          });
        }
        if (d.sourceUrls && d.sourceUrls.length > 0) {
          html += '<div style="font-size:11px;color:var(--ink-m);margin-top:12px;padding-top:10px;border-top:1px solid var(--bdr)">Source: <a href="' + escapeHTML(d.sourceUrls[0]) + '" target="_blank" rel="noopener noreferrer" style="color:var(--accent)">' + escapeHTML(d.sourceUrls[0]) + '</a></div>';
        }
        html += '</div>';
        return html;
      },

      tagClick: function(tag) {
        this.lookupWord(tag);
      },

      lookupWord: function(term) {
        if (!term || !term.trim()) return;
        var t = term.trim();
        var tLow = norm(t);

        // Exact headword, English then Chinese. Both maps hold the most common
        // homograph, so 和 opens "and" rather than the surname.
        var match = BY_EN.get(tLow) || BY_ZH.get(t) || BY_ZH_S.get(t);

        // Inflected form: "running" -> "run". The dictionary's own exchange data
        // covers most of these, but a short prefix probe is a cheap fallback.
        if (!match && /^[a-z'-]+$/.test(tLow) && tLow.length > 3) {
          for (var cut = 1; cut <= 3 && !match; cut++) {
            var stem = tLow.slice(0, -cut);
            if (stem.length >= 3) match = BY_EN.get(stem);
          }
        }

        // Single Chinese character with no entry of its own: fall back to the
        // shortest word containing it.
        if (!match && t.length === 1 && /[一-鿿]/.test(t)) {
          var bestLen = 99;
          for (var i = 0; i < DICTIONARY.length; i++) {
            var w = DICTIONARY[i];
            if (w._type === "zh-en" && w.chinese_traditional.indexOf(t) !== -1 &&
                w.chinese_traditional.length < bestLen) {
              match = w; bestLen = w.chinese_traditional.length;
              if (bestLen === 1) break;
            }
          }
        }

        if (match) this.openWord(match);
        else this.forceTranslate(t);
      },

      clearHistory: function(e) {
        if (e) e.stopPropagation();
        this.state.history = [];

        this.flash("Search history cleared");

        var histWrap = document.getElementById('hist-body-wrap');
        if (histWrap) histWrap.innerHTML = this.buildHistorySettingsHTML();
      },

      removeHistoryItem: function(e, idx) {
        if (e) e.stopPropagation();
        this.state.history.splice(idx, 1);
        this.saveHistory();
        this.updateSearchUI(this.state.query);
        var histWrap = document.getElementById('hist-body-wrap');
        if (histWrap) histWrap.innerHTML = this.buildHistorySettingsHTML();
      },

      setThemeId: function(id) {
        this.state.themeId = id;
        this.savePrefs();
        this.applyTheme();
        Object.values(THEMES).forEach(function(th) {
          var card = document.getElementById('theme-card-' + th.id);
          if (card) {
            if (th.id === id) {
              card.classList.add('sel');
              card.style.borderColor = THEMES[id].accent;
              if (!card.querySelector('.theme-check')) {
                card.insertAdjacentHTML('afterbegin', '<div class="theme-check">' + I.Check + '</div>');

            } else {
              card.classList.remove('sel');
              card.style.borderColor = th.border;

              if (check) check.remove();

          }
        });

        this.applyTheme();

      parsePosGroups: function(zhTransList) {
        var groups = [];
        var groupMap = {};
        var posRegex = /^([a-z]+\.)\s*/i;
        for (var i = 0; i < zhTransList.length; i++) {
          var item = zhTransList[i];
          var match = item.match(posRegex);
          var pos = match ? match[1] : "";
          var text = match ? item.substring(match[0].length) : item;
          var defs = text.split(/[；;]/).map(function(s) { return s.trim(); }).filter(function(s) { return s; });
          if (pos && groupMap[pos] !== undefined) {
            groups[groupMap[pos]].defs = groups[groupMap[pos]].defs.concat(defs);
          } else {
            groupMap[pos] = groups.length;
            groups.push({ pos: pos, defs: defs });
          }
        }
        return groups;
      },

      buildDropdownHTML: function() {
        var s = this.state;
        
        // Hide dropdown entirely if we are on the search screen 
        // (because the search screen displays the results natively on the page)
        if (s.view === "search") return "";

        var showDropdown = s.focused && s.query.trim().length === 0 && s.history.length > 0;
        var showResults = s.focused && s.query.trim().length > 0;
        var html = "";
        
        if (showDropdown) {
          html += '<div class="dd" id="dropdown-ref"><div class="dd-hdr"><span>' + I.Clock + ' Recent</span><button onclick="app.clearHistory(event)">Clear All</button></div>';
          s.history.slice(0, 10).forEach(function(h, idx) {
            html += '<div class="di" onclick="app.openFromHistory(' + idx + ')"><div class="di-main"><span style="color:var(--ink-m);flex-shrink:0">' + I.Clock + '</span><span class="di-en">' + escapeHTML(h.label) + '</span></div><div class="di-side"><span class="di-zh">' + escapeHTML(h.sub || '') + '</span><button class="di-rm" aria-label="Remove from history" onclick="app.removeHistoryItem(event, ' + idx + ')">' + I.X + '</button></div></div>';
          });
          html += '</div>';
        } else if (showResults) {
          html += '<div class="dd" id="dropdown-ref">';
          if (s.results.length > 0) {
            s.results.forEach(function(r, idx) {
              html += '<div class="di" onclick="app.openSearchResult(' + idx + ')"><div class="di-main"><span class="di-en">' + escapeHTML(r.label) + '</span></div><div class="di-side"><span class="di-zh">' + escapeHTML(r.sub) + '</span><span class="di-tag di-tag-word">' + (r.data._type === 'en-zh' ? 'EN' : '中') + '</span></div></div>';
            });
          } else {
            // Google Translate fallback hook when no dictionary items match
            html += '<div style="padding:18px;text-align:center;color:var(--ink-m);font-size:var(--fs)">No dictionary results for "' + escapeHTML(s.query) + '"</div>';
            html += '<div class="di" style="justify-content:center; color:var(--accent); font-weight:600; border-top:1px solid var(--bdr);" onclick="app.forceTranslate(\'' + safeQuote(s.query) + '\')">🌐 Translate "' + escapeHTML(s.query) + '"</div>';
          }
          html += '</div>';
        }
        return html;
      },

      buildHistorySettingsHTML: function() {

        }

        if (s.view === "settings") {
          html += '<div class="sett"><h2>Settings</h2><p class="sett-sub">Customize your experience</p><div class="sett-label">Theme</div><div class="theme-grid">';
          Object.values(THEMES).forEach(function(th) {
            html += '<div id="theme-card-' + th.id + '" class="theme-card ' + (s.themeId === th.id ? 'sel' : '') + '" style="background:' + th.cardBg + ';border-color:' + (s.themeId === th.id ? t.accent : th.border) + '" onclick="app.setThemeId(\'' + th.id + '\')">' + (s.themeId === th.id ? '<div class="theme-check">' + I.Check + '</div>' : "") + '<div class="theme-preview"><div style="background:' + th.paper + '"></div><div style="background:' + th.accent + '"></div><div style="background:' + th.paperWarm + '"></div><div style="background:' + th.ink + '"></div></div><div class="theme-name" style="color:' + th.ink + '"><span>' + th.emoji + '</span> ' + th.name + '</div></div>';
          });
          html += '</div>';

          html += '<div class="fs-section"><div class="sett-label">Font Size</div><div class="fs-bar">';
          FONT_SIZES.forEach(function(fs) {
            var preview = 11 + (fs.value - MIN_FONT) * 0.42;
            html += '<button id="fs-btn-' + fs.value + '" class="fs-btn ' + (s.fontSize === fs.value ? 'sel' : '') + '" aria-pressed="' + (s.fontSize === fs.value) + '" aria-label="Text size ' + escapeHTML(fs.label) + '" onclick="app.setFontSize(' + fs.value + ')" style="font-size:' + preview.toFixed(1) + 'px">' + escapeHTML(fs.label) + '</button>';
          });
          html += '</div><div class="fs-preview"><div class="fs-preview-en">perseverance</div><div class="fs-preview-zh">毅力 · yì lì</div></div></div>';

          html += '<div class="hist-section" id="hist-section"><div class="sett-label">Search History</div><div class="hist-card"><div class="hist-header" onclick="app.toggleHistorySettings()"><div class="hist-header-left"><span class="icon">' + I.Clock + '</span><div class="info"><h4>View History</h4><p>' + s.history.length + ' ' + (s.history.length === 1 ? 'search' : 'searches') + ' saved</p></div></div><span id="hist-chevron" class="hist-chevron ' + (s.showHistorySettings ? 'open' : '') + '">▾</span></div><div id="hist-body-wrap">' + this.buildHistorySettingsHTML() + '</div></div></div>';

          html += '<div class="about-section"><h3>About</h3><p>Dr. 張簡 English-中文 Reference is an offline-first dictionary combining <strong>CC-CEDICT</strong> (中→英) and <strong>ECDICT</strong> (英→中). Search by English, Chinese, or pinyin — with or without tone numbers.</p>' + '<p style="margin-top:10px">' + DICTIONARY.length.toLocaleString() + ' entries available offline.</p>' + '<p style="margin-top:12px;font-size:calc(12px * var(--sc));color:var(--ink-m)">Version 3.0.0<br/>© 2026 TapTiger Development LLC. All rights reserved.</p></div></div>';
        }

        html += '</div>'; // #page-content — tab bar and toast stay outside so they don't slide

        html += '<nav class="tb" aria-label="Main"><button class="tbn ' + (s.view === 'home' || s.view === 'search' ? 'on' : '') + '" aria-label="Home" aria-current="' + (s.view === 'home' || s.view === 'search' ? 'page' : 'false') + '" onclick="app.setView(\'home\')">' + I.Home + '<span>Home</span></button><button class="tbn ' + (s.view === 'favorites' ? 'on' : '') + '" aria-label="Favorites" aria-current="' + (s.view === 'favorites' ? 'page' : 'false') + '" onclick="app.setView(\'favorites\')">' + I.Heart + '<span>Favorites</span></button><button class="tbn ' + (s.view === 'settings' ? 'on' : '') + '" aria-label="Settings" aria-current="' + (s.view === 'settings' ? 'page' : 'false') + '" onclick="app.setView(\'settings\')">' + I.Gear + '<span>Settings</span></button></nav>';

        html += '<div id="toast-container" role="status" aria-live="polite">';
        if (s.toast) html += '<div class="toast">' + escapeHTML(s.toast) + '</div>';
        html += '</div></div>';
        return html;
      }
    };

    app.init();
  </script>
</body>
</html>
